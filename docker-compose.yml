services:
  postgres:
    image: postgres:16-alpine
    container_name: schoolbridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: schoolbridge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d schoolbridge"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: schoolbridge-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

  osrm:
    image: osrm/osrm-backend:latest
    container_name: schoolbridge-osrm
    restart: unless-stopped
    volumes:
      - ./osrm-data:/osrm-data
    command: sh -c "osrm-routed --algorithm mld /osrm-data/nigeria-latest.osrm"
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/route/v1/driving/3.3792,6.5244;3.3792,6.5244?overview=false || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  schoolbridge-bot:
    build: .
    container_name: schoolbridge-bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      osrm:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/schoolbridge
      DISTANCE_PROVIDER: osrm
      OSRM_BASE_URL: http://osrm:5000
    volumes:
      - ./logs:/app/logs
      - ./osrm-data:/osrm-data
    command: >
      sh -c "alembic upgrade head && python main.py"

volumes:
  pgdata:
    driver: local
